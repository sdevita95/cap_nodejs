_schema-version: 3.3.0
ID: testBacklog68
description: A simple CAP project.
version: 1.0.0
modules:
  - name: testBacklog68-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: testBacklog68-auth
      - name: testBacklog68-destination-service
      - name: testBacklog68-postgres
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci
  - name: testBacklog68-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: testBacklog68-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - comsaptestbacklog68uimodule.zip
          name: comsaptestbacklog68uimodule
          target-path: resources/
  - name: comsaptestbacklog68uimodule
    type: html5
    path: app/testbacklog68-uimodule
    requires:
      - name: testBacklog68-auth
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
  - name: testBacklog68-postgres-deployer
    type: nodejs
    path: gen/pg
    parameters:
      buildpack: nodejs_buildpack
      no-route: true
      no-start: true
      tasks:
        - name: deploy-to-postgresql
          command: npm start
    requires:
      - name: testBacklog68-postgres
resources:
  - name: testBacklog68_html_repo_runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
  - name: testBacklog68-auth
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        tenant-mode: dedicated
        xsappname: testBacklog68-${org}-${space}
      path: ./xs-security.json
      service: xsuaa
      service-plan: application
  - name: testBacklog68-destination-service
    type: org.cloudfoundry.managed-service
    requires:
      - name: srv-api
    parameters:
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
              - Authentication: NoAuthentication
                HTML5.ForwardAuthToken: true
                Name: backend
                ProxyType: Internet
                Type: HTTP
                URL: ~{srv-api/srv-url}
                HTML5.Timeout: 300001
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-name: testBacklog68-destination-service
      service-plan: lite
  - name: testBacklog68-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: testBacklog68-html5-service
      service-plan: app-host
  - name: testBacklog68-postgres
    type: org.cloudfoundry.managed-service
    parameters:
      service: postgresql-db
      service-plan: trial
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
#        - bash ./pg-build.sh
        - node pg-build.js