_schema-version: 3.3.0
ID: testRename
description: A simple CAP project.
version: 1.0.0
modules:
  - name: testRename-srv
    type: nodejs
    path: gen/srv
    requires:
      - name: testRename-auth
      - name: testRename-destination-service
      - name: testRename-postgres
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    parameters:
      buildpack: nodejs_buildpack
      instances: 1
    build-parameters:
      builder: npm-ci
  - name: testRename-approuter
    type: approuter.nodejs
    path: approuter
    requires:
      - name: testRename_html_repo_runtime
      - name: testRename-auth
      - name: testRename-destination-service
      - name: srv-api
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}
    parameters:
      disk-quota: 256M
      keep-existing-routes: true
      memory: 256M
  - name: testRename-app-content
    type: com.sap.application.content
    path: .
    requires:
      - name: testRename-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - artifacts:
            - comsaptestrenameuimodule.zip
          name: comsaptestrenameuimodule
          target-path: resources/
  - name: comsaptestrenameuimodule
    type: html5
    path: app/testrename-uimodule
    requires:
      - name: testRename-auth
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms:
        []
  - name: testRename-postgres-deployer
    type: nodejs
    path: gen/pg
    parameters:
      buildpack: nodejs_buildpack
      no-route: true
      no-start: true
      tasks:
        - name: deploy-to-postgresql
          command: npm start
    requires:
      - name: testRename-postgres
resources:
  - name: testRename_html_repo_runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
  - name: testRename-auth
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        tenant-mode: dedicated
        xsappname: testRename-${org}-${space}
      path: ./xs-security.json
      service: xsuaa
      service-plan: application
  - name: testRename-destination-service
    type: org.cloudfoundry.managed-service
    requires:
      - name: srv-api
    parameters:
      config:
        HTML5Runtime_enabled: false
        init_data:
          instance:
            destinations:
              - Authentication: NoAuthentication
                Name: ui5
                ProxyType: Internet
                Type: HTTP
                URL: https://ui5.sap.com
              - Authentication: NoAuthentication
                HTML5.ForwardAuthToken: true
                Name: backend
                ProxyType: Internet
                Type: HTTP
                URL: ~{srv-api/srv-url}
                HTML5.Timeout: 300001
            existing_destinations_policy: update
        version: 1.0.0
      service: destination
      service-name: testRename-destination-service
      service-plan: lite
  - name: testRename-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-name: testRename-html5-service
      service-plan: app-host
  - name: testRename-postgres
    type: org.cloudfoundry.managed-service
    parameters:
      service: postgresql-db
      service-plan: trial
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - bash ./pg-build.sh